[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecut"
version = "0.1.0"
description = "Trading video automation tool for TikTok/YouTube Shorts"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.0.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "numpy>=1.24.0",
    "edge-tts>=6.0",
    "scipy>=1.11.0",
]

[project.scripts]
tradecut = "tradecut.cli:main"

[tool.setuptools.packages.find]
where = ["."]
